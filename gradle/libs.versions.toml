[versions]
agp = "9.5.2"
# Android tools libraries are versioned AGP major + 23.
android-tools = "32.5.2"
compose-multiplatform = "1.12.2"
junit = "5.13.4"
kotlin = "2.4.20"
ktlint = "14.2.0"
ktlint-version = "1.8.0"

[libraries]
android-gradle-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
android-manifest-merger = { module = "com.android.tools.build:manifest-merger", version.ref = "android-tools" }
android-tools-common = { module = "com.android.tools:common", version.ref = "android-tools" }
compose-gradle-plugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose-multiplatform" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
